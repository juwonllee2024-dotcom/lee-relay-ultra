name: History Lab CI
on:
  push:
    paths:
      - 'apps/history-lab/**'
  pull_request:
    paths:
      - 'apps/history-lab/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/history-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
